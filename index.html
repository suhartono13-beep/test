<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我们的家庭日常站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background: #f9f9f9; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, select { display: block; width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; }
        button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button.logout { background: #9e9e9e; margin-top: 10px; }
        .log-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .del-btn { background: #ff4d4d; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; width: auto; font-size: 12px; }
        /* 专属功能块样式 */
        .exclusive-panel { display: none; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 14px; }
        #momPanel { background: #fff0f6; border: 1px solid #ffadd2; color: #c41d7f; }
        #dadPanel { background: #e6f7ff; border: 1px solid #91d5ff; color: #096dd9; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #333;">🏡 家庭日常空间</h1>

    <div id="loginBox" class="box">
        <h3>家人登录</h3>
        <input type="text" id="username" placeholder="输入你的名字代号 (如: father, mother)">
        <input type="password" id="password" placeholder="输入密码">
        <button onclick="login()">进入空间</button>
    </div>

    <div id="mainBox" class="box" style="display: none;">
        <h3 id="welcomeMsg">欢迎</h3>
        
        <hr>
        <h4>新增一条记录</h4>
        
        <label for="category">操作类型：</label>
        <select id="category"></select>
        
        <input type="text" id="content" placeholder="今天写点什么？">
        <button onclick="addRecord()">提交记录</button>

        <div id="momPanel" class="exclusive-panel">💡 提示：今日触发了财务同步，记得核对账单哦。</div>
        <div id="dadPanel" class="exclusive-panel">🛠️ 提示：本周轮到你清理抽油烟机啦！</div>

        <hr>
        <h4>我的历史记录</h4>
        <div id="myRecordsList">加载中...</div>

        <button onclick="logout()" class="logout">退出登录</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://cabqmwtayaojrvdehqrt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhYnFtd3RheWFvanJ2ZGVocXJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MjkzOTMsImV4cCI6MjA5NTEwNTM5M30.t7AXfodxLT84j1UV1ghcQeSKTbi7pt24Ha1iTLTmaog';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const SUFFIX = '@family.local'; 

        // 登录
        async function login() {
            const user = document.getElementById('username').value.trim().toLowerCase(); // 转小写防错
            const pass = document.getElementById('password').value;
            if(!user || !pass) return alert('请输入代号和密码');

            const { data, error } = await client.auth.signInWithPassword({
                email: user + SUFFIX,
                password: pass
            });

            if (error) alert('登录失败，密码错啦');
            else checkUser();
        }

        // 登出
        async function logout() {
            await client.auth.signOut();
            checkUser();
        }

        // 检查状态
        async function checkUser() {
            const { data: { session } } = await client.auth.getSession();
            if (session) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('mainBox').style.display = 'block';
                
                // 提取出用户名 (如 mother, father)
                const username = session.user.email.split('@')[0];
                document.getElementById('welcomeMsg').innerText = `你好，${username} 欢迎回家！`;
                
                // 核心：根据不同的人定制不同的功能和界面
                setupFamilyRole(username);
                
                fetchMyRecords();
            } else {
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('mainBox').style.display = 'none';
            }
        }

        // 【核心函数】根据成员身份，分发不同的具体功能
        function setupFamilyRole(username) {
            const categorySelect = document.getElementById('category');
            
            // 先清空原有的选项
            categorySelect.innerHTML = '';
            
            // 隐藏所有的专属面板
            document.getElementById('momPanel').style.display = 'none';
            document.getElementById('dadPanel').style.display = 'none';

            // 根据名字，塞入不同的专属功能选项
            if (username === 'mother') {
                // 妈妈专属功能
                addOption(categorySelect, '💰 家庭记账', '家庭记账');
                addOption(categorySelect, '📝 生活记录', '生活记录');
                // 显示妈妈专属提示
                document.getElementById('momPanel').style.display = 'block';
                
            } else if (username === 'father') {
                // 爸爸专属功能
                addOption(categorySelect, '🧹 家务打卡', '家务打卡');
                addOption(categorySelect, '🛠️ 房屋修缮', '房屋修缮');
                addOption(categorySelect, '📝 生活记录', '生活记录');
                // 显示爸爸专属提示
                document.getElementById('dadPanel').style.display = 'block';
                
            } else if (username === 'child') {
                // 孩子专属功能
                addOption(categorySelect, '📚 学习打卡', '学习打卡');
                addOption(categorySelect, '🍬 零花钱记账', '零花钱记账');
            } else {
                // 备用：其他可能添加的普通成员
                addOption(categorySelect, '📝 普通记录', '普通记录');
            }
        }

        // 辅助工具：往下拉菜单加选项
        function addOption(selectElement, text, value) {
            const opt = document.createElement('option');
            opt.text = text;
            opt.value = value;
            selectElement.add(opt);
        }

        // 拉取数据
        async function fetchMyRecords() {
            const { data, error } = await client
                .from('family_records')
                .select('*')
                .order('created_at', { ascending: false });

            const listDiv = document.getElementById('myRecordsList');
            listDiv.innerHTML = '';

            if (error || !data || data.length === 0) {
                listDiv.innerHTML = '<p style="color:#999;">暂无记录</p>';
                return;
            }

            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `
                    <span>[${item.category}] ${item.content}</span>
                    <button class="del-btn" onclick="deleteRecord(${item.id})">删除</button>
                `;
                listDiv.appendChild(div);
            });
        }

        // 添加数据
        async function addRecord() {
            const content = document.getElementById('content').value.trim();
            const category = document.getElementById('category').value;
            if(!content) return alert('内容不能为空');

            const { error } = await client
                .from('family_records')
                .insert([{ content, category }]);

            if (error) alert('保存失败');
            else {
                document.getElementById('content').value = '';
                fetchMyRecords();
            }
        }

        // 删除数据
        async function deleteRecord(id) {
            if(!confirm('确定要删除这条记录吗？')) return;
            
            const { error } = await client
                .from('family_records')
                .delete()
                .eq('id', id);

            if (error) alert('删除失败');
            else fetchMyRecords();
        }

        window.onload = checkUser;
    </script>
</body>
</html>
