<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏡 家庭日常空间</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 💡 核心改变 2：优化移动端全局样式，去掉死板的固定宽度 */
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 16px; 
            max-width: 600px; 
            margin: 0 auto; 
            background: #f4f6f9; 
            color: #333;
            -webkit-tap-highlight-color: transparent; /* 移除手机点击时的自带高亮阴影 */
        }
        
        .box { 
            background: white; 
            padding: 20px; 
            border-radius: 16px; /* 移动端更圆润的卡片设计 */
            box-shadow: 0 4px 16px rgba(0,0,0,0.04); 
            margin-bottom: 16px; 
        }
        
        h1 { font-size: 24px; text-align: center; color: #2c3e50; margin: 20px 0; }
        h3 { font-size: 18px; margin-top: 0; }
        h4 { font-size: 16px; margin: 15px 0 10px 0; color: #2c3e50; }
        
        /* 💡 核心改变 3：增大输入框和选择框的高度，更方便手机手指点选 */
        input, select { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            box-sizing: border-box; 
            border: 1px solid #dcdfe6; 
            border-radius: 10px; 
            font-size: 15px; /* 防止 iOS 浏览器自动放大输入框 */
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #4CAF50;
        }
        
        /* 💡 核心改变 4：加大按钮点击区域（符合大拇指触控热区） */
        button { 
            width: 100%; 
            padding: 14px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            box-shadow: 0 2px 6px rgba(76, 175, 80, 0.2);
            active-transform: scale(0.98); /* 点击时微弱的按压反馈 */
        }
        button:active {
            background: #43a047;
        }
        button.logout { 
            background: #f4f5f7; 
            color: #606266;
            box-shadow: none;
            margin-top: 15px; 
        }
        button.logout:active {
            background: #e4e7ed;
        }
        
        /* 历史记录列表移动端优化：左右分布，内容过长自动换行 */
        .log-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 14px 0; 
            border-bottom: 1px solid #f0f2f5; 
            align-items: center; 
        }
        .log-item span {
            font-size: 14px; 
            color: #303133; 
            line-height: 1.5;
            padding-right: 10px;
            word-break: break-all; /* 防止英文长字符串撑破布局 */
        }
        .del-btn { 
            background: #ff4d4d; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: auto; 
            font-size: 13px; 
            flex-shrink: 0; /* 防止删除按钮被长文本挤压变形 */
            box-shadow: 0 2px 4px rgba(255, 77, 77, 0.1);
        }
        .del-btn:active {
            background: #dd3333;
        }
        
        /* 四人职业专属看板移动端优化 */
        .exclusive-panel { 
            display: none; 
            padding: 14px; 
            border-radius: 10px; 
            margin-top: 12px; 
            font-size: 14px; 
            font-weight: 500; 
            line-height: 1.5;
        }
        #momPanel { background: #fff0f6; border: 1px solid #ffadd2; color: #c41d7f; }
        #dadPanel { background: #e6f7ff; border: 1px solid #91d5ff; color: #096dd9; }
        #sisterPanel { background: #f9f0ff; border: 1px solid #d3adf7; color: #722ed1; }
        #brotherPanel { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
    </style>
</head>
<body>

    <h1>🏡 我们的家庭空间</h1>

    <div id="loginBox" class="box">
        <h3 style="margin-bottom: 15px;">家人密码登录</h3>
        <input type="text" id="username" placeholder="请输入代号 (mother, father, ...)模">
        <input type="password" id="password" placeholder="请输入你的专属密码">
        <button onclick="login()">进入空间</button>
    </div>

    <div id="mainBox" class="box" style="display: none;">
        <h3 id="welcomeMsg" style="color: #2c3e50;">欢迎回家</h3>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        
        <h4>➕ 新增一条记录</h4>
        <label for="category" style="font-size:12px; color:#909399; display:block; margin-bottom:5px;">当前可用功能：</label>
        <select id="category"></select>
        
        <input type="text" id="content" placeholder="记录点什么...">
        <button onclick="addRecord()">提交保存</button>

        <div id="momPanel" class="exclusive-panel">👩‍💼 妈妈（商人）看板：今日有新的市场灵感吗？记得核对本周资金流水。</div>
        <div id="dadPanel" class="exclusive-panel">👨‍💼 爸爸（商人）看板：和重要客户的约谈资料记得做好备份，出差注意安全。</div>
        <div id="sisterPanel" class="exclusive-panel">👩‍🏫 姐姐（大学老师）看板：下周的教案准备好了吗？记得关注学生的论文初稿进度。</div>
        <div id="brotherPanel" class="exclusive-panel">👨‍💻 姐夫（工程师）看板：家里的路由器、智能家居固件该检查更新了，今天写代码也要多喝水！</div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h4>📋 我的历史足迹</h4>
        <div id="myRecordsList">加载中...</div>

        <button onclick="logout()" class="logout">退出空间</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://cabqmwtayaojrvdehqrt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhYnFtd3RheWFvanJ2ZGVocXJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MjkzOTMsImV4cCI6MjA5NTEwNTM5M30.t7AXfodxLT84j1UV1ghcQeSKTbi7pt24Ha1iTLTmaog';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const SUFFIX = '@family.local'; 

        async function login() {
            const userEl = document.getElementById('username');
            const passEl = document.getElementById('password');
            
            if (!userEl || !passEl) return alert('页面元素损坏，请刷新！');

            const user = userEl.value.trim().toLowerCase();
            const pass = passEl.value;
            
            if (!user || !pass) return alert('请输入代号和密码！');

            const { data, error } = await client.auth.signInWithPassword({
                email: user + SUFFIX,
                password: pass
            });

            if (error) alert('登录失败，密码或代号不对哦');
            else checkUser();
        }

        async function logout() {
            await client.auth.signOut();
            checkUser();
        }

        async function checkUser() {
            const { data: { session } } = await client.auth.getSession();
            const loginBox = document.getElementById('loginBox');
            const mainBox = document.getElementById('mainBox');

            if (session) {
                if (loginBox) loginBox.style.display = 'none';
                if (mainBox) mainBox.style.display = 'block';
                
                const username = session.user.email.split('@')[0];
                const welcomeMsg = document.getElementById('welcomeMsg');
                
                if (welcomeMsg) {
                    if (username === 'brother') welcomeMsg.innerText = `✨ 你好，工程师姐夫！`;
                    else if (username === 'sister') welcomeMsg.innerText = `✨ 你好，周老师（姐姐）！`;
                    else if (username === 'mother') welcomeMsg.innerText = `✨ 你好，妈妈（老板）！`;
                    else if (username === 'father') welcomeMsg.innerText = `✨ 你好，爸爸（老板）！`;
                    else welcomeMsg.innerText = `✨ 你好，${username}！`;
                }
                
                setupFamilyRole(username);
                fetchMyRecords();
            } else {
                if (loginBox) loginBox.style.display = 'block';
                if (mainBox) mainBox.style.display = 'none';
            }
        }

        function setupFamilyRole(username) {
            const categorySelect = document.getElementById('category');
            if (!categorySelect) return;
            categorySelect.innerHTML = ''; 
            
            const panels = ['momPanel', 'dadPanel', 'sisterPanel', 'brotherPanel'];
            panels.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });

            if (username === 'mother') {
                addOption(categorySelect, '📈 商业灵感记事', '商业灵感记事');
                addOption(categorySelect, '💰 商务/家庭记账', '商务家庭记账');
                addOption(categorySelect, '📅 核心日程备忘', '核心日程备忘');
                const p = document.getElementById('momPanel');
                if (p) p.style.display = 'block';
            } else if (username === 'father') {
                addOption(categorySelect, '🤝 重要客户备忘', '重要客户备忘');
                addOption(categorySelect, '🚘 商务出差打卡', '商务出差打卡');
                addOption(categorySelect, '📝 经营心得随笔', '经营心得随笔');
                const p = document.getElementById('dadPanel');
                if (p) p.style.display = 'block';
            } else if (username === 'sister') {
                addOption(categorySelect, '📚 教学备课灵感', '教学备课灵感');
                addOption(categorySelect, '🧪 科研进度打卡', '科研进度打卡');
                addOption(categorySelect, '🎓 学生事务备注', '学生事务备注');
                const p = document.getElementById('sisterPanel');
                if (p) p.style.display = 'block';
            } else if (username === 'brother') {
                addOption(categorySelect, '🛠️ 家庭设备维护', '家庭设备维护');
                addOption(categorySelect, '💻 技术学习/Bug日志', '技术学习Bug日志');
                addOption(categorySelect, '✅ 高效待办清单', '高效待办清单');
                const p = document.getElementById('brotherPanel');
                if (p) p.style.display = 'block';
            } else {
                addOption(categorySelect, '📝 游客日常记录', '游客日常记录');
            }
        }

        function addOption(selectElement, text, value) {
            const opt = document.createElement('option');
            opt.text = text;
            opt.value = value;
            selectElement.add(opt);
        }

        async function fetchMyRecords() {
            const { data, error } = await client
                .from('family_records')
                .select('*')
                .order('created_at', { ascending: false });

            const listDiv = document.getElementById('myRecordsList');
            if (!listDiv) return;
            listDiv.innerHTML = '';

            if (error || !data || data.length === 0) {
                listDiv.innerHTML = '<p style="color:#999; font-size:14px;">这里空空如也，快去记录第一条吧！</p>';
                return;
            }

            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `
                    <span><b>[${item.category}]</b> ${item.content}</span>
                    <button class="del-btn" onclick="deleteRecord(${item.id})">删除</button>
                `;
                listDiv.appendChild(div);
            });
        }

        async function addRecord() {
            const contentEl = document.getElementById('content');
            const categoryEl = document.getElementById('category');
            if (!contentEl || !categoryEl) return;

            const content = contentEl.value.trim();
            const category = categoryEl.value;
            if (!content) return alert('不能提交空空的内容哦！');

            const { error } = await client
                .from('family_records')
                .insert([{ content, category }]);

            if (error) alert('保存失败了！原因：' + error.message);
            else {
                contentEl.value = '';
                fetchMyRecords();
            }
        }

        async function deleteRecord(id) {
            if (!confirm('确定要删除这条足迹吗？')) return;
            const { error } = await client
                .from('family_records')
                .delete()
                .eq('id', id);

            if (error) alert('删除失败：' + error.message);
            else fetchMyRecords();
        }

        window.onload = checkUser;
    </script>
</body>
</html>
