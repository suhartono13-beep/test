<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏡 职业版家庭日常空间</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 16px; 
            max-width: 650px; /* 稍微加宽一点，方便电脑端看表格 */
            margin: 0 auto; 
            background: #f4f6f9; 
            color: #333;
            -webkit-tap-highlight-color: transparent; 
        }
        
        .box { 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.04); 
            margin-bottom: 16px; 
        }
        
        h1 { font-size: 24px; text-align: center; color: #2c3e50; margin: 20px 0; }
        h3 { font-size: 18px; margin-top: 0; }
        h4 { font-size: 16px; margin: 15px 0 10px 0; color: #2c3e50; }
        
        input, select { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            box-sizing: border-box; 
            border: 1px solid #dcdfe6; 
            border-radius: 10px; 
            font-size: 15px; 
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: #4CAF50; }
        
        button { 
            width: 100%; 
            padding: 14px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            box-shadow: 0 2px 6px rgba(76, 175, 80, 0.2);
        }
        button:active { background: #43a047; }
        button.logout { 
            background: #f4f5f7; 
            color: #606266;
            box-shadow: none;
            margin-top: 15px; 
        }
        button.logout:active { background: #e4e7ed; }
        
        .exclusive-panel { 
            display: none; 
            padding: 14px; 
            border-radius: 10px; 
            margin-top: 12px; 
            font-size: 14px; 
            font-weight: 500; 
            line-height: 1.6;
        }
        #momPanel { background: #fff0f6; border: 1px solid #ffadd2; color: #c41d7f; }
        #dadPanel { background: #e6f7ff; border: 1px solid #91d5ff; color: #096dd9; }
        #sisterPanel { background: #f9f0ff; border: 1px solid #d3adf7; color: #722ed1; }
        #brotherPanel { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }

        .external-link-btn {
            display: inline-block;
            margin-top: 10px;
            margin-right: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
        .btn-recipe { background-color: #ff7875; box-shadow: 0 2px 4px rgba(255, 120, 117, 0.3); }
        .btn-health { background-color: #52c41a; box-shadow: 0 2px 4px rgba(82, 196, 26, 0.3); }

        /* 💡 新增：表格及其容器专属样式 */
        .table-responsive {
            width: 100%;
            overflow-x: auto; /* 防止表格在手机上过宽撑破页面 */
            -webkit-overflow-scrolling: touch;
        }
        .record-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 450px; /* 保证表格列不会被无限压缩 */
        }
        .record-table th, .record-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #f0f2f5;
            text-align: left;
            vertical-align: middle;
        }
        .record-table th {
            background-color: #fafafa;
            color: #909399;
            font-weight: 600;
            white-space: nowrap;
        }
        .record-table td.content-col {
            color: #303133;
            word-break: break-all;
            min-width: 150px; /* 内容列稍微宽一点 */
        }
        .record-table td.action-col {
            text-align: right;
            white-space: nowrap;
            width: 50px;
        }
        .del-btn { 
            background: #ff4d4d; 
            color: white; 
            border: none; 
            padding: 6px 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 12px; 
            box-shadow: 0 2px 4px rgba(255, 77, 77, 0.1);
        }
        .del-btn:active { background: #dd3333; }
    </style>
</head>
<body>

    <h1>🏡 我们的家庭空间</h1>

    <div id="loginBox" class="box">
        <h3 style="margin-bottom: 15px;">家人密码登录</h3>
        <input type="text" id="username" placeholder="请输入代号 (mother, father, ...)">
        <input type="password" id="password" placeholder="请输入你的专属密码">
        <button onclick="login()">进入空间</button>
    </div>

    <div id="mainBox" class="box" style="display: none;">
        <h3 id="welcomeMsg" style="color: #2c3e50;">欢迎回家</h3>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        
        <h4>➕ 新增一条记录</h4>
        <label for="category" style="font-size:12px; color:#909399; display:block; margin-bottom:5px;">当前可用功能：</label>
        <select id="category" onchange="handleCategoryChange()"></select>
        
        <input type="text" id="content" placeholder="记录点什么...">
        <button onclick="addRecord()">提交保存</button>

        <div id="momPanel" class="exclusive-panel">
            <b>👩‍💼 妈妈（商人）健康看板：</b><br>
            💡 提示：今日有新的市场灵感吗？忙碌之余记得一键登记血压血糖。<br>
            <div style="margin-top: 8px; border-top: 1px dashed #ffadd2; padding-top: 8px;">
                <b>🍳 养生菜谱与营养直达站：</b><br>
                <a href="https://www.xiachufang.com/search/?keyword=%E6%8E%A7%E7%B3%96%E9%99%8D%E5%8E%8B" target="_blank" class="external-link-btn btn-recipe">🔍 查控糖降压菜谱</a>
                <a href="https://www.boohee.com/food/" target="_blank" class="external-link-btn btn-health">🥗 查食物热量/升糖</a>
            </div>
        </div>
        <div id="dadPanel" class="exclusive-panel">👨‍💼 爸爸（商人）看板：和重要客户的约谈资料记得做好备份，出差注意安全。</div>
        <div id="sisterPanel" class="exclusive-panel">👩‍🏫 姐姐（马老师）看板：下周的教案准备好了吗？记得关注学生的论文初稿进度。</div>
        <div id="brotherPanel" class="exclusive-panel">👷‍♂️ 姐夫（建筑师）看板：最近的建筑图纸画完了吗？去工地视察一定要记得戴好安全帽，注意安全！</div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h4>📋 我的历史足迹</h4>
        
        <div id="myRecordsList">加载中...</div>

        <button onclick="logout()" class="logout">退出空间</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://cabqmwtayaojrvdehqrt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhYnFtd3RheWFvanJ2ZGVocXJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MjkzOTMsImV4cCI6MjA5NTEwNTM5M30.t7AXfodxLT84j1UV1ghcQeSKTbi7pt24Ha1iTLTmaog';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const SUFFIX = '@family.local'; 

        async function login() {
            const userEl = document.getElementById('username');
            const passEl = document.getElementById('password');
            if (!userEl || !passEl) return alert('页面元素损坏，请刷新！');

            const user = userEl.value.trim().toLowerCase();
            const pass = passEl.value;
            if (!user || !pass) return alert('请输入代号和密码！');

            const { data, error } = await client.auth.signInWithPassword({
                email: user + SUFFIX,
                password: pass
            });

            if (error) alert('登录失败，密码或代号不对哦');
            else checkUser();
        }

        async function logout() {
            await client.auth.signOut();
            checkUser();
        }

        async function checkUser() {
            const { data: { session } } = await client.auth.getSession();
            const loginBox = document.getElementById('loginBox');
            const mainBox = document.getElementById('mainBox');

            if (session) {
                if (loginBox) loginBox.style.display = 'none';
                if (mainBox) mainBox.style.display = 'block';
                
                const username = session.user.email.split('@')[0];
                const welcomeMsg = document.getElementById('welcomeMsg');
                
                if (welcomeMsg) {
                    if (username === 'brother') welcomeMsg.innerText = `✨ 你好，建筑师姐夫！`;
                    else if (username === 'sister') welcomeMsg.innerText = `✨ 你好，马老师（姐姐）！`;
                    else if (username === 'mother') welcomeMsg.innerText = `✨ 你好，妈妈（老板）！`;
                    else if (username === 'father') welcomeMsg.innerText = `✨ 你好，爸爸（老板）！`;
                    else welcomeMsg.innerText = `✨ 你好，${username}！`;
                }
                
                setupFamilyRole(username);
                fetchMyRecords();
            } else {
                if (loginBox) loginBox.style.display = 'block';
                if (mainBox) mainBox.style.display = 'none';
            }
        }

        function setupFamilyRole(username) {
            const categorySelect = document.getElementById('category');
            if (!categorySelect) return;
            categorySelect.innerHTML = ''; 
            
            const panels = ['momPanel', 'dadPanel', 'sisterPanel', 'brotherPanel'];
            panels.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });

            if (username === 'mother') {
                addOption(categorySelect, '🩺 血压血糖登记', '血压血糖登记');
                addOption(categorySelect, '🍳 每日养生打卡', '每日养生打卡');
                addOption(categorySelect, '📈 商业灵感记事', '商业灵感记事');
                addOption(categorySelect, '💰 商务/家庭记账', '商务家庭记账');
                addOption(categorySelect, '📅 核心日程备忘', '核心日程备备忘');
                const p = document.getElementById('momPanel');
                if (p) p.style.display = 'block';
                handleCategoryChange();
            } else if (username === 'father') {
                addOption(categorySelect, '🤝 重要客户备忘', '重要客户备忘');
                addOption(categorySelect, '🚘 商务出差打卡', '商务出差打卡');
                addOption(categorySelect, '📝 经营心得随笔', '经营心得随笔');
                const p = document.getElementById('dadPanel');
                if (p) p.style.display = 'block';
            } else if (username === 'sister') {
                addOption(categorySelect, '📚 教学备课灵感', '教学备课灵感');
                addOption(categorySelect, '🧪 科研进度打卡', '科研进度打卡');
                addOption(categorySelect, '🎓 学生事务备注', '学生事务备注');
                const p = document.getElementById('sisterPanel');
                if (p) p.style.display = 'block';
            } else if (username === 'brother') {
                addOption(categorySelect, '📐 建筑设计灵感', '建筑设计灵感');
                addOption(categorySelect, '🏗️ 施工视察打卡', '施工视察打卡');
                addOption(categorySelect, '📅 项目进度备忘', '项目进度备忘');
                const p = document.getElementById('brotherPanel');
                if (p) p.style.display = 'block';
            } else {
                addOption(categorySelect, '📝 游客日常记录', '游客日常记录');
            }
        }

        function handleCategoryChange() {
            const category = document.getElementById('category').value;
            const contentEl = document.getElementById('content');
            if(!contentEl) return;
            
            if (category === '血压血糖登记') {
                contentEl.placeholder = '例如：高压125，低压82，空腹血糖5.6';
            } else if (category === '每日养生打卡') {
                contentEl.placeholder = '例如：今天喝够了8杯水 / 晚餐吃了清炒苦瓜';
            } else {
                contentEl.placeholder = '记录点什么...';
            }
        }

        function addOption(selectElement, text, value) {
            const opt = document.createElement('option');
            opt.text = text;
            opt.value = value;
            selectElement.add(opt);
        }

        // 💡 核心改版：用表格渲染数据
        async function fetchMyRecords() {
            const { data, error } = await client
                .from('family_records')
                .select('*')
                .order('created_at', { ascending: false });

            const listDiv = document.getElementById('myRecordsList');
            if (!listDiv) return;
            listDiv.innerHTML = '';

            if (error || !data || data.length === 0) {
                listDiv.innerHTML = '<p style="color:#999; font-size:14px; text-align:center; padding:20px 0;">这里空空如也，快去记录第一条吧！</p>';
                return;
            }

            // 构建表格头部
            let tableHTML = `
                <div class="table-responsive">
                    <table class="record-table">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>分类</th>
                                <th>记录内容</th>
                                <th style="text-align: right;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            // 循环填入表格内容
            data.forEach(item => {
                // 格式化时间，比如 "05-24 14:30"
                const d = new Date(item.created_at);
                const timeStr = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                
                let tagColor = "#2c3e50";
                if(item.category === '血压血糖登记') tagColor = "#e91e63";
                if(item.category === '每日养生打卡') tagColor = "#ff9800";

                tableHTML += `
                    <tr>
                        <td style="color:#909399; font-size:12px; white-space:nowrap;">${timeStr}</td>
                        <td style="color:${tagColor}; font-weight:bold; white-space:nowrap;">${item.category}</td>
                        <td class="content-col">${item.content}</td>
                        <td class="action-col">
                            <button class="del-btn" onclick="deleteRecord(${item.id})">删除</button>
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;
            
            listDiv.innerHTML = tableHTML;
        }

        async function addRecord() {
            const contentEl = document.getElementById('content');
            const categoryEl = document.getElementById('category');
            if (!contentEl || !categoryEl) return;

            const content = contentEl.value.trim();
            const category = categoryEl.value;
            if (!content) return alert('不能提交空空的内容哦！');

            const { error } = await client
                .from('family_records')
                .insert([{ content, category }]);

            if (error) alert('保存失败了！原因：' + error.message);
            else {
                contentEl.value = '';
                fetchMyRecords();
            }
        }

        async function deleteRecord(id) {
            if (!confirm('确定要删除这条足迹吗？')) return;
            const { error } = await client
                .from('family_records')
                .delete()
                .eq('id', id);

            if (error) alert('删除失败：' + error.message);
            else fetchMyRecords();
        }

        window.onload = checkUser;
    </script>
</body>
</html>
